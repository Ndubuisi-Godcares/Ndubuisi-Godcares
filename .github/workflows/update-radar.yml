name: Update Activity Radar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate radar SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: Ndubuisi-Godcares
        run: python generate_radar.py

      - name: Commit and push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-radar.svg
          git diff --cached --quiet || git commit -m "chore: update activity radar [skip ci]"
          git push
